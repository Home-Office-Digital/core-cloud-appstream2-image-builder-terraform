name: Terraform Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-tests:
    uses: ./.github/workflows/terraform-tests-reusable.yml
    with:
      modules_root: modules
      terraform_version: 1.9.8
      comment_on_pr: true
    secrets: inherit