name: SAST Scans

on:
  workflow_call:
    secrets:
      sonar_token:
        required: true
      sonar_host_url:
        required: true
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions: read-all

jobs:
  checkov-scan:
    uses: UKHomeOffice/core-cloud-workflow-checkov-sast-scan/.github/workflows/checkov-scan-base.yaml@1.7.0
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write

  sonarqube-scanner:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write sonar-project.properties
        run: |
          cat > sonar-project.properties << 'EOF'
          sonar.projectKey=core-cloud-appstream2-image-builder-terraform
          sonar.projectName=CC AppStream Image Builder TF Modules
          sonar.sources=modules
          sonar.exclusions=**/.terragrunt-cache/**,**/outputs/**,**/*.tfplan
          sonar.qualitygate.wait=false
          sonar.issues.fail=false
          sonar.scm.provider=git
          EOF
          echo "Generated sonar-project.properties:"
          cat sonar-project.properties
      - name: SonarQube Scan
        uses: UKHomeOffice/core-cloud-workflow-sonarqube-scan@1.1.4
        with:
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          sonar_host_url: ${{ secrets.SONAR_HOST_URL }}